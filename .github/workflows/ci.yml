# 3RD EYE pipeline: runs automatically on GitHub for every push to main
# and every pull request. Two guards:
#   1. secret-scan: Gitleaks checks the whole history for passwords/keys
#   2. tests:       pytest runs every 3RD EYE check against a fake AWS

name: 3RD EYE CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the pipeline may only READ the code, nothing more
permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Get the code (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Gitleaks and verify its checksum
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          BASE=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          curl -sSLO ${BASE}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSLO ${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt
          sha256sum --check --ignore-missing gitleaks_${GITLEAKS_VERSION}_checksums.txt
          tar -xzf gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz gitleaks

      - name: Scan every commit for secrets
        run: ./gitleaks git --redact -v

  tests:
    name: Tests (pytest + fake AWS)
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install 3RD EYE and testing tools
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the tests
        run: python -m pytest -v